# Configuration de lychee (vérification des liens).
# 403 et 429 sont acceptés : plusieurs sites de documentation refusent les robots
# ou limitent le débit, sans que le lien soit cassé.
accept = ["200..=299", "403", "429"]
max_retries = 2
exclude_path = ["node_modules"]
# Liens vers le dépôt lui-même : invalides tant qu'il n'est pas publié.
exclude = ["^https://github\.com/wApMorty/AtelierAgentique"]
