# Sources de la veille hebdomadaire (ADR-004 : 25 sources au plus).
# Format volontairement restreint (liste de dictionnaires plats) : lu par veille/collecter.py sans dépendance.
#
# type      : atom | rss | page | hn | github (recherche) | github-api (versions ou commits d'un dépôt ;
#             les flux .atom de github.com sont refusés depuis les sessions cloud, l'API ne l'est pas)
# confiance : officiel | pratique | emergent   (niveaux de la base, voir knowledge/_gabarit.md)
# url       : {depuis} (AAAA-MM-JJ) et {depuis_ts} (horodatage Unix) sont remplacés par le début de la fenêtre
# exclure   : expression régulière ; les éléments dont le titre correspond sont ignorés (préversions…)
# liens     : pour type page, expression régulière des liens à surveiller ; sans « liens », seul un changement du contenu est signalé
# Tous les domaines ci-dessous doivent figurer dans la liste blanche réseau de l'environnement cloud (veille/scheduled-task.md).

- id: claude-code-releases
  nom: Claude Code — versions
  url: https://api.github.com/repos/anthropics/claude-code/releases?per_page=10
  type: github-api
  categorie: changelog
  confiance: officiel
  justification: Notes de version de l'outil principal ; détecte les changements de format (hooks, skills, plugins).

- id: claude-code-whats-new
  nom: Claude Code — nouveautés hebdomadaires
  url: https://code.claude.com/docs/en/whats-new
  type: page
  liens: /docs/en/whats-new/
  categorie: changelog
  confiance: officiel
  justification: Synthèse hebdomadaire officielle, plus lisible que les notes de version.

- id: claude-code-changelog
  nom: Claude Code — changelog de la documentation
  url: https://code.claude.com/docs/en/changelog
