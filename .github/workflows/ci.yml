name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  liens:
    name: Vérification des liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          jobSummary: true

  manifestes:
    name: Validation des manifestes de plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Marketplace et plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .
          for p in plugins/*/; do
            npx -y @anthropic-ai/claude-code plugin validate --strict "$p"
          done

  plugins:
    name: Tests des hooks et conformité des skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Tests des hooks
        run: python -m unittest discover -s plugins/garde-fous/tests -v
      - name: Format des skills (ADR-003)
        run: python .github/scripts/verifier_skills.py
